name: Windows build (MSYS2 + MLT)

# Cadena de herramientas elegida (ver DECISIONS/0003): MSYS2 UCRT64 para todo.
# Compila el núcleo y la interfaz Qt, ejecuta las pruebas, comprueba que MLT
# renderiza el MP4 de una línea de tiempo real generada por NEXO, empaqueta y
# prueba el paquete SIN MSYS2 en el PATH.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: msys2-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-mlt
            mingw-w64-ucrt-x86_64-ffmpeg

      # Dependencias opcionales de los módulos de MLT (audio, títulos, filtros). Si un
      # paquete no existe se avisa y se sigue: el script de empaquetado omite el módulo.
      - name: Install optional MLT dependencies
        shell: msys2 {0}
        run: |
          for p in fftw libebur128 libsamplerate rubberband lilv sox rtaudio rnnoise qt6-svg; do
            pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-$p 2>&1 | tail -2 || echo "::warning::paquete no disponible: $p"
          done
          ls /ucrt64/bin | grep -i -E "fftw3-3|lilv|ebur128|samplerate|rubberband|sox-3|rtaudio|rnnoise|Qt6Svg" | tr '\n' ' '

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEXO_GIT_COMMIT="${{ github.sha }}"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Unit tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Generate test clips and project XML
        shell: msys2 {0}
        run: |
          mkdir -p evidence
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc=duration=4:size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=4 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest evidence/clipA.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i smptebars=duration=4:size=640x360:rate=30 -f lavfi -i sine=frequency=880:duration=4 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest evidence/clipB.mp4
          build/tests/mlt_xml_tool evidence/proj.mlt evidence/clipA.mp4 evidence/clipB.mp4
          cat evidence/proj.mlt

      # Vuelca lo que melt sabe de un video, un audio y una imagen (duración, tamaño, tasa...).
      # Se usa para escribir el lector de medios del editor con los nombres reales.
      - name: Probe media with melt (evidence for the importer)
        continue-on-error: true
        shell: msys2 {0}
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i sine=frequency=440:duration=2 evidence/tone.wav
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=duration=1:size=320x240:rate=1 -frames:v 1 evidence/pic.png
          for f in clipA.mp4 tone.wav pic.png; do
            melt "evidence/$f" out=0 -consumer xml > "evidence/probe_$f.mlt" 2>"evidence/probe_$f.err" || true
            body="$(sed -n '/<producer/,/<\/producer>/p' "evidence/probe_$f.mlt" | head -n 150 | sed 's/^ *//' | cut -c1-110 | tr '\n' '|')"
            echo "::notice title=Probe $f::${body:0:3800}"
          done

      # Comprueba que el lector de medios de NEXO entiende la salida REAL de melt.
      - name: Check NEXO media probe against real melt output
        shell: msys2 {0}
        run: |
          grep -m1 '<profile' evidence/probe_clipA.mp4.mlt | cut -c1-300 | sed 's/^/profile: /' | tee evidence/profile_line.txt
          echo "::notice title=Linea profile real::$(cat evidence/profile_line.txt)"
          chk() { # archivo, patrones...
            f="$1"; shift
            out="$(build/tests/probe_tool "evidence/probe_$f.mlt" 30 1)"; echo "$f -> $out"
            echo "::notice title=probe_tool $f::$out"
            for pat in "$@"; do echo "$out" | grep -q "$pat" || { echo "::error title=probe_tool $f::falta '$pat' en: $out"; return 1; }; done
          }
          rc=0
          chk clipA.mp4 "kind=video" "frames=120" "width=640" "height=360" "video=1" "audio=1" || rc=1
          chk tone.wav "kind=audio" "frames=60" "video=0" "audio=1" || rc=1
          chk pic.png "kind=image" "width=320" "height=240" "frames=150" || rc=1
          exit $rc

      # La vista previa de la app pide un fotograma suelto a melt como PNG.
      - name: Render single preview frame with melt
        shell: msys2 {0}
        run: |
          build/tests/mlt_xml_tool evidence/proj_abs.mlt "$(pwd -W)/evidence/clipA.mp4" "$(pwd -W)/evidence/clipB.mp4" > /dev/null
          melt evidence/proj_abs.mlt in=45 out=45 -consumer avformat:evidence/frame45.png vcodec=png > evidence/frame.log 2>&1 || true
          ls -l evidence/frame45.png
          info="$(ffprobe -v error -count_frames -show_entries stream=codec_name,width,height,nb_read_frames -of default=nw=1 evidence/frame45.png | tr '\n' ' ')"
          echo "::notice title=Fotograma de vista previa::$info"
          echo "$info" | grep -q "width=640" && echo "$info" | grep -q "height=360"

      # Volumen y fundidos: el render real debe oscurecer el primer y último fotograma (clip con sourceIn=30) y bajar el audio ~6 dB.
      - name: Render clip with volume and fades
        shell: msys2 {0}
        run: |
          build/tests/mlt_xml_tool evidence/fx.mlt "$(pwd -W)/evidence/clipA.mp4" "$(pwd -W)/evidence/clipB.mp4" --fx
          grep -A3 '<filter>' evidence/fx.mlt | head -12
          melt evidence/fx.mlt -consumer avformat:evidence/fx.mp4 vcodec=libx264 acodec=aac > evidence/fx.log 2>&1 || true
          ffmpeg -hide_banner -i evidence/fx.mp4 -vf signalstats,metadata=print:key=lavfi.signalstats.YAVG -an -f null - 2>&1 | grep -o 'YAVG=[0-9.]*' > evidence/fx_yavg.txt
          y0=$(sed -n 1p evidence/fx_yavg.txt | cut -d= -f2); ymid=$(sed -n 46p evidence/fx_yavg.txt | cut -d= -f2); yend=$(sed -n 90p evidence/fx_yavg.txt | cut -d= -f2)
          vol_fx=$(ffmpeg -hide_banner -i evidence/fx.mp4 -af volumedetect -vn -f null - 2>&1 | grep -o 'max_volume: [-0-9.]*' | cut -d' ' -f2)
          vol_start=$(ffmpeg -hide_banner -i evidence/fx.mp4 -af atrim=0:0.1,volumedetect -vn -f null - 2>&1 | grep -o 'max_volume: [-0-9.]*' | cut -d' ' -f2)
          vol_orig=$(ffmpeg -hide_banner -i evidence/clipA.mp4 -af volumedetect -vn -f null - 2>&1 | grep -o 'max_volume: [-0-9.]*' | cut -d' ' -f2)
          msg="YAVG inicio=$y0 medio=$ymid final=$yend; max_volume fx=$vol_fx primeros 0.1 s=$vol_start original=$vol_orig dB"
          echo "::notice title=Volumen y fundidos (render real)::$msg"
          awk -v a="$y0" -v b="$ymid" -v c="$yend" -v f="$vol_fx" -v o="$vol_orig" -v s0="$vol_start" 'BEGIN{ ok=(s0<o-12 && b>40 && a<b*0.25 && c<b*0.35 && (o-f)>4 && (o-f)<12); exit ok?0:1 }' || { echo "::error title=Volumen y fundidos::no se cumplen las condiciones: $msg"; exit 1; }

      # Diagnóstico: qué sintaxis del filtro volume de melt funciona para ganancia constante, animada y rampa.
      - name: Diagnose melt volume filter syntax
        if: always()
        continue-on-error: true
        shell: msys2 {0}
        run: |
          vd() { ffmpeg -hide_banner -i "$1" -af "$2volumedetect" -vn -f null - 2>&1 | grep -o 'max_volume: [-0-9.]*' | cut -d' ' -f2; }
          run() { # nombre, argumentos de filtro...
            n="$1"; shift
            melt evidence/clipA.mp4 "$@" -consumer avformat:evidence/vol_$n.mp4 vcodec=libx264 acodec=aac > evidence/vol_$n.log 2>&1 || true
            echo "$n: todo=$(vd evidence/vol_$n.mp4 '') inicio=$(vd evidence/vol_$n.mp4 'atrim=0:0.5,') medio=$(vd evidence/vol_$n.mp4 'atrim=1.5:2.5,') final=$(vd evidence/vol_$n.mp4 'atrim=3.5:4,')"
          }
          {
            echo "original: todo=$(vd evidence/clipA.mp4 '')"
            run const -filter volume gain=0.5
            run anim_simple -filter volume "gain=0=0.5;119=0.5"
            run anim_ramp -filter volume "gain=0=0;30=1"
            run rampa_in_out -filter volume gain=0 end=1 in=0 out=29
            run db -filter volume gain=-6dB
          } | tee evidence/vol_diag.txt
          echo "::notice title=Sintaxis de volume en melt::$(tr '\n' '|' < evidence/vol_diag.txt)"

      - name: Capture melt progress output format
        continue-on-error: true
        shell: msys2 {0}
        run: |
          build/tests/mlt_xml_tool evidence/proj_abs.mlt "$(pwd -W)/evidence/clipA.mp4" "$(pwd -W)/evidence/clipB.mp4" > /dev/null
          melt evidence/proj_abs.mlt -progress2 -consumer avformat:evidence/out_progress.mp4 vcodec=libx264 acodec=aac > /dev/null 2> evidence/progress2.log || true
          sample="$(tr '\r' '\n' < evidence/progress2.log | grep -v -i 'ladspa\|lv2\|vst' | head -n 6 | cut -c1-120 | tr '\n' '|')"
          echo "::notice title=melt -progress2 real::${sample:0:1500}"

      - name: Render NEXO timeline with melt (MSYS2 install)
        shell: msys2 {0}
        run: melt evidence/proj.mlt -consumer avformat:evidence/out_msys.mp4 vcodec=libx264 acodec=aac 2>&1 | tee evidence/melt-msys.log

      - name: Versions and licensing evidence
        shell: msys2 {0}
        run: |
          {
            pacman -Q mingw-w64-ucrt-x86_64-mlt mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-qt6-base
            pacman -Qi mingw-w64-ucrt-x86_64-mlt mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-qt6-base | grep -E "^(Name|Version|Licenses)"
            ffmpeg -hide_banner -version | grep -E "^(ffmpeg version|configuration)"
          } 2>&1 | tee evidence/versions.txt
          echo "::notice title=Versiones y licencias (pacman)::$(grep -E '^(Name|Version|Licenses)' evidence/versions.txt | tr '\n' '|')"
          echo "::notice title=FFmpeg: configuración::$(ffmpeg -hide_banner -version | grep '^configuration' | tr ' ' '\n' | grep -E 'enable-(gpl|nonfree|version3|libx264|libx265)' | tr '\n' ' ')"

      - name: Package
        shell: msys2 {0}
        run: |
          scripts/package_windows_msys2.sh build/src/app/nexo-video-ai.exe dist/NEXO-VIDEO-AI 2>&1 | tee evidence/package.log
          om="$(grep OMITIDO evidence/package.log | tr '\n' '|' || true)"
          if [ -n "$om" ]; then echo "::warning title=Módulos de MLT omitidos del paquete::$om"; else echo "::notice title=Módulos de MLT::ninguno omitido"; fi
          {
            echo "NEXO VIDEO AI"
            echo "commit:  ${{ github.sha }}"
            echo "fecha:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "config:  Release, MSYS2 UCRT64, Qt6, MLT + FFmpeg"
            echo "uso:     Iniciar NEXO VIDEO AI.cmd (o bin\\nexo-video-ai.exe). melt.exe es reubicable: lib\\mlt y share\\mlt junto a bin\\"
          } > dist/NEXO-VIDEO-AI/build-info.txt

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/NEXO-VIDEO-AI -DestinationPath NEXO-VIDEO-AI-msys2-windows-x64.zip

      # Diagnóstico: importaciones de cada binario que no están en bin/ ni en System32.
      - name: Diagnose package dependencies
        continue-on-error: true
        shell: msys2 {0}
        run: |
          cd dist/NEXO-VIDEO-AI
          missing=""
          for f in bin/nexo-video-ai.exe bin/melt.exe $(find lib bin/platforms bin/styles -name '*.dll'); do
            for n in $(objdump -p "$f" 2>/dev/null | awk '/DLL Name:/ {print $3}'); do
              low=$(echo "$n" | tr 'A-Z' 'a-z')
              case "$low" in api-ms-win-*|ext-ms-win-*|kernel32.dll|msvcrt.dll|user32.dll|ws2_32.dll|advapi32.dll|shell32.dll|ole32.dll|gdi32.dll|bcrypt.dll|crypt32.dll) continue;; esac
              ls bin | grep -qix "$n" && continue
              ls /c/Windows/System32 | grep -qix "$n" && continue
              missing="$missing $f needs $n;"
            done
          done
          if [ -n "$missing" ]; then echo "::error title=DLL que faltan en el paquete::${missing}"; else echo "Todas las importaciones están en bin/ o en System32"; fi
          echo "::notice title=Listado del paquete::raíz: $(ls | tr '\n' ' ')| lib/mlt: $(ls lib/mlt | wc -l) módulos| share/mlt: $(ls share/mlt | tr '\n' ' ')| bin: $(ls bin | wc -l) archivos"

      # Se ejecuta con un PATH que NO incluye MSYS2: solo lo que hay en el ZIP.
      - name: Smoke test - packaged app
        shell: pwsh
        run: |
          Expand-Archive NEXO-VIDEO-AI-msys2-windows-x64.zip -DestinationPath smoke
          $pkg = (Resolve-Path smoke/NEXO-VIDEO-AI).Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process "$pkg\bin\nexo-video-ai.exe" -ArgumentList "--version" -Wait -PassThru
          $hex = '0x{0:X8}' -f $p.ExitCode
          if ($p.ExitCode -ne 0) {
            Write-Host "::error title=nexo-video-ai.exe empaquetado no arrancó::código de salida $($p.ExitCode) ($hex). 0xC0000135 = falta una DLL; 0xC000007B = DLL de arquitectura incorrecta."
            exit 1
          }

      # melt es reubicable: busca lib\mlt y share\mlt junto a bin\. La aplicación lo lanzará
      # igual, con el PATH apuntando a su carpeta bin.
      - name: Smoke test - packaged melt renders the NEXO project
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $pkg = (Resolve-Path smoke/NEXO-VIDEO-AI).Path
          $proj = "$root\evidence\proj.mlt"
          $out = "$root\evidence\out_pkg.mp4"
          $sys = "$env:SystemRoot\System32;$env:SystemRoot"
          $variants = @(
            @{ n='A: reubicable, sin variables'; repo=$null; data=$null },
            @{ n='B: con MLT_REPOSITORY y MLT_DATA'; repo="$pkg\lib\mlt"; data="$pkg\share\mlt" }
          )
          $summary = @(); $winner = $null
          foreach ($v in $variants) {
            Remove-Item $out -ErrorAction SilentlyContinue
            $env:PATH = "$pkg\bin;$sys"
            if ($v.repo) { $env:MLT_REPOSITORY = $v.repo } else { Remove-Item Env:MLT_REPOSITORY -ErrorAction SilentlyContinue }
            if ($v.data) { $env:MLT_DATA = $v.data } else { Remove-Item Env:MLT_DATA -ErrorAction SilentlyContinue }
            $log = "$root\evidence\melt-pkg-$($v.n.Substring(0,1)).log"
            $m = Start-Process "$pkg\bin\melt.exe" -WorkingDirectory $root `
                   -ArgumentList "-verbose","`"$proj`"","-consumer","avformat:`"$out`"","vcodec=libx264","acodec=aac" `
                   -Wait -PassThru -RedirectStandardError $log -RedirectStandardOutput "$log.out" -NoNewWindow
            $ok = ($m.ExitCode -eq 0) -and (Test-Path $out)
            $lines = @(Get-Content $log -ErrorAction SilentlyContinue | Where-Object { $_ -and $_ -notmatch '^No (LADSPA|LV2|VST2)' })
            $first = ($lines | Select-Object -Last 8) -join ' / '
            $summary += "$($v.n) => " + $(if ($ok) { 'FUNCIONA' } else { "falla (código $($m.ExitCode)): $first" })
            if ($ok -and -not $winner) { $winner = $v.n; break }
          }
          if ($winner) { Write-Host "::notice title=melt empaquetado funciona con la variante::$winner%0A$($summary -join '%0A')" }
          else { Write-Host "::error title=melt empaquetado: ninguna variante funcionó::$($summary -join '%0A')"; exit 1 }

      - name: Verify exported videos
        shell: msys2 {0}
        run: |
          for f in out_msys out_pkg; do
            echo "== $f"
            ffprobe -v error -count_frames -show_entries stream=codec_type,codec_name,width,height,nb_read_frames -of default=nw=1 evidence/$f.mp4 | tee evidence/ffprobe_$f.txt
            grep -q "width=640"  evidence/ffprobe_$f.txt
            grep -q "height=360" evidence/ffprobe_$f.txt
            grep -q "codec_type=audio" evidence/ffprobe_$f.txt
            grep -q "nb_read_frames=120" evidence/ffprobe_$f.txt   # 60 + 60 fotogramas de video
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msys2-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-VIDEO-AI-msys2-windows-x64-${{ github.sha }}
          path: NEXO-VIDEO-AI-msys2-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
