name: Windows build (MSYS2 + MLT)

# Cadena de herramientas elegida (ver DECISIONS/0003): MSYS2 UCRT64 para todo.
# Compila el núcleo y la interfaz Qt, ejecuta las pruebas, comprueba que MLT
# renderiza el MP4 de una línea de tiempo real generada por NEXO, empaqueta y
# prueba el paquete SIN MSYS2 en el PATH.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: msys2-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-mlt
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEXO_GIT_COMMIT="${{ github.sha }}"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Unit tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Generate test clips and project XML
        shell: msys2 {0}
        run: |
          mkdir -p evidence
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc=duration=4:size=640x360:rate=30 -f lavfi -i sine=frequency=440:duration=4 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest evidence/clipA.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i smptebars=duration=4:size=640x360:rate=30 -f lavfi -i sine=frequency=880:duration=4 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest evidence/clipB.mp4
          build/tests/mlt_xml_tool evidence/proj.mlt evidence/clipA.mp4 evidence/clipB.mp4
          cat evidence/proj.mlt

      - name: Render NEXO timeline with melt (MSYS2 install)
        shell: msys2 {0}
        run: melt evidence/proj.mlt -consumer avformat:evidence/out_msys.mp4 vcodec=libx264 acodec=aac 2>&1 | tee evidence/melt-msys.log

      - name: Versions and licensing evidence
        shell: msys2 {0}
        run: |
          {
            pacman -Q mingw-w64-ucrt-x86_64-mlt mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-qt6-base
            pacman -Qi mingw-w64-ucrt-x86_64-mlt mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-qt6-base | grep -E "^(Name|Version|Licenses)"
            ffmpeg -hide_banner -version | grep -E "^(ffmpeg version|configuration)"
          } 2>&1 | tee evidence/versions.txt

      - name: Package
        shell: msys2 {0}
        run: |
          scripts/package_windows_msys2.sh build/src/app/nexo-video-ai.exe dist/NEXO-VIDEO-AI
          {
            echo "NEXO VIDEO AI"
            echo "commit:  ${{ github.sha }}"
            echo "fecha:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "config:  Release, MSYS2 UCRT64, Qt6, MLT + FFmpeg"
            echo "uso:     nexo-video-ai.exe ; melt.exe necesita MLT_REPOSITORY=lib\\mlt y MLT_DATA=share\\mlt"
          } > dist/NEXO-VIDEO-AI/build-info.txt

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/NEXO-VIDEO-AI -DestinationPath NEXO-VIDEO-AI-msys2-windows-x64.zip

      # Diagnóstico: importaciones de cada binario que no están en el paquete ni en
      # System32 (los módulos de MLT buscan sus dependencias en la carpeta raíz).
      - name: Diagnose package dependencies
        continue-on-error: true
        shell: msys2 {0}
        run: |
          cd dist/NEXO-VIDEO-AI
          missing=""
          for f in nexo-video-ai.exe melt.exe $(find lib platforms styles -name '*.dll'); do
            for n in $(objdump -p "$f" 2>/dev/null | awk '/DLL Name:/ {print $3}'); do
              low=$(echo "$n" | tr 'A-Z' 'a-z')
              case "$low" in api-ms-win-*|ext-ms-win-*) continue;; esac
              [ -f "$n" ] && continue
              ls /c/Windows/System32 | grep -qi "^$n$" && continue
              missing="$missing $f needs $n;"
            done
          done
          if [ -n "$missing" ]; then echo "::error title=DLL que faltan en el paquete::${missing}"; else echo "Todas las importaciones están en el paquete o en System32"; fi

      # Se ejecuta con un PATH que NO incluye MSYS2: solo lo que hay en el ZIP.
      - name: Smoke test - packaged app
        shell: pwsh
        run: |
          Expand-Archive NEXO-VIDEO-AI-msys2-windows-x64.zip -DestinationPath smoke
          $pkg = (Resolve-Path smoke/NEXO-VIDEO-AI).Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process "$pkg\nexo-video-ai.exe" -ArgumentList "--version" -Wait -PassThru
          $hex = '0x{0:X8}' -f $p.ExitCode
          if ($p.ExitCode -ne 0) {
            Write-Host "::error title=nexo-video-ai.exe empaquetado no arrancó::código de salida $($p.ExitCode) ($hex). 0xC0000135 = falta una DLL; 0xC000007B = DLL de arquitectura incorrecta."
            exit 1
          }

      # Carga cada módulo de MLT con LoadLibrary (igual que hace MLT) y anota el código
      # de error de Windows: 126 = falta una DLL de la que depende, 193 = arquitectura
      # incorrecta, 127 = función no encontrada (versión de DLL distinta).
      - name: Diagnose MLT module loading
        continue-on-error: true
        shell: pwsh
        run: |
          $pkg = (Resolve-Path smoke/NEXO-VIDEO-AI).Path
          $env:PATH = "$pkg;$env:SystemRoot\System32;$env:SystemRoot"
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Unicode)]
            public static extern IntPtr LoadLibraryW(string p);
          }
          "@
          $mods = Get-ChildItem "$pkg\lib\mlt" -Filter *.dll -ErrorAction SilentlyContinue
          $lines = @("módulos encontrados: $($mods.Count); carpeta raíz del paquete: $((Get-ChildItem $pkg -Filter *.dll).Count) DLL")
          foreach ($m in $mods) {
            $h = [W]::LoadLibraryW($m.FullName)
            if ($h -eq [IntPtr]::Zero) { $lines += "FALLA $($m.Name): error $([Runtime.InteropServices.Marshal]::GetLastWin32Error())" }
            else { $lines += "ok $($m.Name)" }
          }
          $bad = $lines | Where-Object { $_ -like 'FALLA*' }
          $head = $lines[0]
          if ($bad) { Write-Host "::error title=Módulos de MLT que no cargan::$head%0A$($bad -join '%0A')" }
          else { Write-Host "::notice title=Módulos de MLT::$head. Todos cargan.%0A$(($lines | Select-Object -Skip 1 | Select-Object -First 40) -join '%0A')" }

      - name: Smoke test - packaged melt renders the NEXO project
        shell: pwsh
        run: |
          $pkg = (Resolve-Path smoke/NEXO-VIDEO-AI).Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:MLT_REPOSITORY = "$pkg\lib\mlt"
          $env:MLT_DATA = "$pkg\share\mlt"
          $m = Start-Process "$pkg\melt.exe" -ArgumentList "evidence/proj.mlt","-consumer","avformat:evidence/out_pkg.mp4","vcodec=libx264","acodec=aac" `
                 -Wait -PassThru -RedirectStandardError evidence/melt-pkg.log -RedirectStandardOutput evidence/melt-pkg.out -NoNewWindow
          $hex = '0x{0:X8}' -f $m.ExitCode
          if ($m.ExitCode -ne 0 -or -not (Test-Path evidence/out_pkg.mp4)) {
            $tail = ((Get-Content evidence/melt-pkg.log -Tail 25 -ErrorAction SilentlyContinue) -join "%0A")
            Write-Host "::error title=melt empaquetado falló (código $($m.ExitCode) $hex)::$tail"
            exit 1
          }

      - name: Verify exported videos
        shell: msys2 {0}
        run: |
          for f in out_msys out_pkg; do
            echo "== $f"
            ffprobe -v error -count_frames -show_entries stream=codec_type,codec_name,width,height,nb_read_frames -of default=nw=1 evidence/$f.mp4 | tee evidence/ffprobe_$f.txt
            grep -q "width=640"  evidence/ffprobe_$f.txt
            grep -q "height=360" evidence/ffprobe_$f.txt
            grep -q "codec_type=audio" evidence/ffprobe_$f.txt
            grep -q "nb_read_frames=120" evidence/ffprobe_$f.txt   # 60 + 60 fotogramas de video
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msys2-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-VIDEO-AI-msys2-windows-x64-${{ github.sha }}
          path: NEXO-VIDEO-AI-msys2-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
