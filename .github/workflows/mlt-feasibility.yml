name: MLT feasibility (Windows)

# Prueba de viabilidad: ¿MLT + FFmpeg pueden renderizar un MP4 real en un ejecutor
# Windows? Usa los paquetes de MSYS2 (UCRT64; MINGW64 está marcado como obsoleto).
# No forma parte del producto: solo produce evidencia. La carpeta evidence/ se sube
# SIEMPRE, también cuando algún paso falla, para poder diagnosticar.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mlt-feasibility.yml"

permissions:
  contents: read

jobs:
  mlt:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Find package names
        run: |
          mkdir -p evidence
          pacman -Sy --noconfirm
          {
            echo "== mlt =="
            pacman -Ss mlt | grep -i "ucrt64/" || echo "(sin resultados en ucrt64)"
            echo
            echo "== ffmpeg =="
            pacman -Ss ffmpeg | grep -i "ucrt64/" || echo "(sin resultados en ucrt64)"
          } 2>&1 | tee evidence/pacman-search.txt

      - name: Install MLT and FFmpeg
        run: |
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-mlt mingw-w64-ucrt-x86_64-ffmpeg 2>&1 | tee evidence/pacman-install.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Versions and licensing evidence
        run: |
          {
            echo "== paquetes =="
            pacman -Q mingw-w64-ucrt-x86_64-mlt mingw-w64-ucrt-x86_64-ffmpeg
            echo
            echo "== licencias declaradas por pacman =="
            pacman -Qi mingw-w64-ucrt-x86_64-mlt mingw-w64-ucrt-x86_64-ffmpeg | grep -E "^(Name|Version|Licenses)"
            echo
            echo "== ffmpeg: configuración (busca --enable-gpl / --enable-nonfree) =="
            ffmpeg -hide_banner -version | grep -E "^(ffmpeg version|configuration)"
          } 2>&1 | tee evidence/versions.txt

      - name: MLT capabilities
        run: |
          which melt | tee evidence/melt-path.txt
          melt -query consumers > evidence/consumers.txt 2>&1 || true
          melt -query producers > evidence/producers.txt 2>&1 || true
          melt -query filters   > evidence/filters.txt   2>&1 || true
          wc -l evidence/consumers.txt evidence/producers.txt evidence/filters.txt

      - name: Render a real MP4 with MLT
        run: |
          # 75 fotogramas (3 s a 25 fps) de color sólido, codificados con libx264.
          melt color:blue out=74 -consumer avformat:evidence/test.mp4 vcodec=libx264 an=1 2>&1 | tee evidence/melt-render.log
          ls -l evidence/test.mp4

      - name: Verify the exported file
        run: |
          test -s evidence/test.mp4
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=codec_name,width,height,nb_read_frames \
            -of default=nw=1 evidence/test.mp4 | tee evidence/ffprobe.txt
          grep -q "nb_read_frames=75" evidence/ffprobe.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlt-feasibility-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
